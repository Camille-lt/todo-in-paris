<div class="events-grid">
  @for (event of events(); track event.id) {
    <mat-card class="event-card">
      @if (event.coverUrl) {
        <img mat-card-image [src]="event.coverUrl" [alt]="event.title">
      }
      <mat-card-header>
        <mat-card-title>{{ event.title }}</mat-card-title>
        <mat-card-subtitle>
          {{ event.addressName }} ({{ event.addressZipcode }}) — {{ event.dateStart }}
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p>{{ event.leadText }}</p>
        <div class="chips-container">
          <mat-chip>{{ event.priceType }}</mat-chip>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button color="primary">En savoir plus</button>
      </mat-card-actions>
    </mat-card>
  }
</div>
